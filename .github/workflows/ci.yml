name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing in `.env.sample` is secret — every value in it ships inside the
      # APK anyway — so CI uses it verbatim rather than carrying repo secrets.
      - name: Use the sample environment
        run: cp .env.sample .env

      - name: Typecheck
        run: npm run typecheck

      # The 401 suite is the load-bearing one. Without that handling the app
      # silently stopped working fifteen minutes after sign-in and remote
      # sign-out did nothing — and neither failure surfaced as an error
      # anywhere, which is exactly the kind a typecheck cannot see.
      - name: Test
        run: npm run test:ci

      # The typecheck alone does not prove the app starts. Metro resolves
      # imports its own way, and a missing native module or a bad `@env` entry
      # is invisible to tsc and fatal at launch — on a TV that means a white
      # screen in someone's living room with no way to read the error. Bundling
      # is the cheapest thing that catches it.
      - name: Bundle
        run: npx expo export --platform android --output-dir dist
        env:
          EXPO_TV: '1'

      # `prebuild` is where the TV config plugin runs. If it stops applying the
      # leanback launcher category, the app still builds and installs and simply
      # never appears on the TV home screen — which looks like a store problem
      # rather than a build one, so it is asserted here instead.
      - name: Verify the Android TV manifest
        run: |
          npx expo prebuild --platform android --no-install
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name="android.hardware.touchscreen" android:required="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:banner=' android/app/src/main/AndroidManifest.xml
        env:
          EXPO_TV: '1'

  # A real native build. The bundle and manifest checks above cannot see a
  # native module that fails to compile against this React Native, and the
  # first place that would otherwise surface is a cloud build hours later. It
  # also leaves a sideloadable APK on every run (Actions -> this run ->
  # Artifacts). That APK is signed with the debug key, so it installs on a TV
  # that does not already have a store or EAS build; uninstall that one first.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Use the sample environment
        run: cp .env.sample .env

      - name: Prebuild the Android TV project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_TV: '1'

      # TVs and streaming sticks are ARM; Fire TV sticks are still 32-bit.
      # Leaving out the x86 ABIs roughly halves the native build time.
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
        env:
          EXPO_TV: '1'
          NODE_ENV: production

      - uses: actions/upload-artifact@v4
        with:
          name: riftn-tv-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
